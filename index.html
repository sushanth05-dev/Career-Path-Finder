    <meta name="description" content="Compare your current skills against any target career role to generate a structured skill gap matrix, an 8-week learning roadmap, and 3 portfolio mini-projects powered by Gemini." />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("careerpath-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-100 selection:text-blue-900 dark:selection:bg-blue-900/50 dark:selection:text-blue-100">

  </body>
